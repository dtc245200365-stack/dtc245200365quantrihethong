# Promtail đọc log của các container product_* qua Docker API rồi đẩy sang Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

# Lưu vị trí đã đọc trong volume để không đọc trùng khi khởi động lại
positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # Chỉ lấy container của dự án (tên bắt đầu bằng product_)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(product_.*)'
        target_label: 'container'
      - source_labels: ['container']
        regex: '.+'
        action: keep
      # Nhãn theo tên dịch vụ trong docker-compose (nginx, mysql, wordpress...)
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
