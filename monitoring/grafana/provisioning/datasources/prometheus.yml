apiVersion: 1

# Xóa datasource tạo tay (nếu có) để nạp lại đúng uid cố định từ repo
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
